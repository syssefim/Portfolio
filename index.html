<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serafim Sharkov</title>
    
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
    <nav>
        <!-- The data-link attribute marks these as SPA links -->
        <a href="/" data-link>Home</a>
        <a href="/about" data-link>About</a>    
        <a href="/projects" data-link>Projects</a>
        <a href="/skills" data-link>Skills</a>
        <a href="/education" data-link>Education</a>
        <a href="/contact" data-link>Contact</a>
    </nav>

    <!--When a user clicks one of the navigation links, the JavaScript 
    router figures out which page was requested, fetches the HTML for 
    that specific page, and injects it directly inside this-->
    <div id="app"></div>

    <!-- Javascript -->
    <script src="script.js"></script>
</body>
</html>
